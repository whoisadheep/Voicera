<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voicera — Rudra Infotek Receptionist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(59, 130, 246, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 1.25rem;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .brand-text {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .live-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Hero / Caller Card */
    .call-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 1.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(59, 130, 246, 0.3);
      animation: rotateRing 20s linear infinite;
    }

    .avatar-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.3s ease;
    }

    .speaking .avatar-pulse {
      animation: pulseWave 1.6s ease-out infinite;
    }

    .listening .avatar-pulse {
      background: var(--accent-green);
      animation: pulseWave 1.6s ease-out infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseWave {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { opacity: 0.25; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .avatar svg {
      width: 44px;
      height: 44px;
      color: #93c5fd;
    }

    .caller-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .caller-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.9rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .status-badge.connecting {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    .status-badge.speaking {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
      color: #60a5fa;
    }

    .status-badge.listening {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .call-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 0.85rem;
      color: #cbd5e1;
      opacity: 0.8;
    }

    /* Transcript Box */
    .transcript-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1rem;
      flex: 1;
      min-height: 160px;
      max-height: 250px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
    }

    .transcript-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
    }

    .transcript-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 0.3rem;
    }

    .transcript-list::-webkit-scrollbar {
      width: 4px;
    }
    .transcript-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .bubble {
      padding: 0.6rem 0.85rem;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.35;
      max-width: 88%;
      word-break: break-word;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble.assistant {
      align-self: flex-start;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #ecfdf5;
      border-bottom-right-radius: 4px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }

    /* Settings / Phone Number */
    .phone-input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.4rem 0.8rem;
      gap: 0.5rem;
    }

    .phone-input-row label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .phone-input-row input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      width: 100%;
    }

    /* Actions */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.5rem 0 1rem 0;
    }

    .action-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .call-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
    }

    .call-btn:active {
      transform: scale(0.92);
    }

    .hangup-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 12px 28px rgba(239, 68, 68, 0.4);
      display: none;
    }

    .hangup-btn:active {
      transform: scale(0.92);
    }

    .secondary-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .secondary-btn.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .action-btn svg, .secondary-btn svg {
      width: 28px;
      height: 28px;
    }
    .secondary-btn svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">V</div>
        <span class="brand-text">Voicera AI</span>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>Phone Test</span>
      </div>
    </header>

    <!-- Caller Card -->
    <div class="call-card" id="callCard">
      <div class="avatar-wrapper">
        <div class="avatar-pulse"></div>
        <div class="avatar-ring"></div>
        <div class="avatar">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
        </div>
      </div>

      <h1 class="caller-title">Rudra Infotek</h1>
      <p class="caller-sub">Kumud Ranjan Ojha's Office</p>

      <div class="status-badge" id="statusBadge">
        <span>Ready to Call</span>
      </div>

      <div class="call-timer" id="callTimer">00:00</div>
    </div>

    <!-- Live Transcript -->
    <div class="transcript-card">
      <div class="transcript-header">
        <span>Live Transcript</span>
        <span id="sttBadge" style="color: #60a5fa;">Sarvam + Groq</span>
      </div>
      <div class="transcript-list" id="transcriptList">
        <div class="empty-state" id="emptyState">Tap the green button to start speaking with the AI receptionist.</div>
      </div>
    </div>

    <!-- Phone number input for GridCRM logging -->
    <div class="phone-input-row">
      <label>Caller Phone:</label>
      <input type="tel" id="callerPhone" value="+919277199206" placeholder="+91..." />
    </div>

    <!-- Call Action Controls -->
    <div class="controls">
      <button class="secondary-btn" id="muteBtn" title="Mute Microphone" style="visibility: hidden;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 01-3-3V4.5a3 3 0 116 0V12a3 3 0 01-3 3z" />
        </svg>
      </button>

      <button class="action-btn call-btn" id="callBtn" title="Start Call">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.21 2.2z"/>
        </svg>
      </button>

      <button class="action-btn hangup-btn" id="hangupBtn" title="End Call">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 010-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
        </svg>
      </button>

      <button class="secondary-btn" id="speakerBtn" title="Audio Status" style="visibility: hidden;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.757 3.63 8.25 4.51 8.25H6.75z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // State
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let processor = null;
    let micSource = null;
    let isCalling = false;
    let isMuted = false;
    let activeSources = [];
    let nextPlayTime = 0;
    let timerInterval = null;
    let callStartTimestamp = 0;

    // DOM Elements
    const callCard = document.getElementById("callCard");
    const statusBadge = document.getElementById("statusBadge");
    const callTimer = document.getElementById("callTimer");
    const callBtn = document.getElementById("callBtn");
    const hangupBtn = document.getElementById("hangupBtn");
    const muteBtn = document.getElementById("muteBtn");
    const speakerBtn = document.getElementById("speakerBtn");
    const transcriptList = document.getElementById("transcriptList");
    const emptyState = document.getElementById("emptyState");
    const callerPhoneInput = document.getElementById("callerPhone");

    function setStatus(state, text) {
      statusBadge.className = "status-badge " + state;
      statusBadge.innerHTML = `<span>${text}</span>`;
      callCard.className = "call-card " + state;
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - callStartTimestamp) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      callTimer.textContent = `${mins}:${secs}`;
    }

    function addTranscript(role, text) {
      if (!text) return;
      if (emptyState) emptyState.style.display = "none";
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.textContent = text;
      transcriptList.appendChild(bubble);
      transcriptList.scrollTop = transcriptList.scrollHeight;
    }

    // Downsampling audio buffer from device sampleRate to 16000Hz
    function downsample(buffer, sampleRate, outSampleRate) {
      if (outSampleRate === sampleRate) return buffer;
      if (outSampleRate > sampleRate) return buffer;
      const ratio = sampleRate / outSampleRate;
      const newLength = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? (accum / count) : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function floatTo16BitPCM(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output;
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function clearPlaybackQueue() {
      for (const src of activeSources) {
        try { src.stop(); } catch(e) {}
      }
      activeSources = [];
      if (audioCtx) {
        nextPlayTime = audioCtx.currentTime;
      }
    }

    function playAudioChunk(base64Payload) {
      if (!audioCtx) return;
      try {
        const binaryStr = window.atob(base64Payload);
        const len = binaryStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const int16 = new Int16Array(bytes.buffer);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 32768.0;
        }

        const audioBuffer = audioCtx.createBuffer(1, float32.length, 16000);
        audioBuffer.copyToChannel(float32, 0);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        activeSources.push(source);

        source.onended = () => {
          const idx = activeSources.indexOf(source);
          if (idx > -1) activeSources.splice(idx, 1);
          if (activeSources.length === 0 && isCalling) {
            setStatus("listening", "Listening to you...");
          }
        };

        const now = audioCtx.currentTime;
        if (nextPlayTime < now) {
          nextPlayTime = now + 0.04;
        }
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;

        setStatus("speaking", "Agent Speaking...");
      } catch (err) {
        console.error("Audio playback error:", err);
      }
    }

    async function startCall() {
      try {
        if (navigator.vibrate) navigator.vibrate(50);
        setStatus("connecting", "Requesting Mic...");

        // Initialize AudioContext on user gesture
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();

        // Get microphone stream
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        setStatus("connecting", "Connecting to Voicera...");

        // Connect WebSocket
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/exotel?sample-rate=16000`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log("[WebPhone] Connected to WebSocket");
          isCalling = true;
          callStartTimestamp = Date.now();
          timerInterval = setInterval(updateTimer, 1000);

          // Update UI
          callBtn.style.display = "none";
          hangupBtn.style.display = "flex";
          muteBtn.style.visibility = "visible";
          speakerBtn.style.visibility = "visible";

          // Send Exotel protocol events
          const streamSid = "web_" + Math.random().toString(36).substring(2, 10);
          const callSid = "web_" + Math.random().toString(36).substring(2, 10);
          const callerId = callerPhoneInput.value.trim() || "+919999999999";

          ws.send(JSON.stringify({ event: "connected" }));
          ws.send(JSON.stringify({
            event: "start",
            start: {
              stream_sid: streamSid,
              call_sid: callSid,
              media_format: { sample_rate: 16000 },
              custom_parameters: {
                caller_id: callerId,
                "sample-rate": "16000"
              }
            }
          }));

          // Set up microphone capture processor
          micSource = audioCtx.createMediaStreamSource(micStream);
          const bufferSize = 2048;
          processor = audioCtx.createScriptProcessor(bufferSize, 1, 1);

          processor.onaudioprocess = (e) => {
            if (!isCalling || isMuted) return;
            const inputData = e.inputBuffer.getChannelData(0);
            const downsampled = downsample(inputData, audioCtx.sampleRate, 16000);
            const pcm16 = floatTo16BitPCM(downsampled);
            const b64 = arrayBufferToBase64(pcm16.buffer);

            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({
                event: "media",
                media: { payload: b64 }
              }));
            }
          };

          micSource.connect(processor);
          processor.connect(audioCtx.destination);

          setStatus("listening", "Listening to you...");
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.event === "media" && msg.media && msg.media.payload) {
              playAudioChunk(msg.media.payload);
            } else if (msg.event === "clear") {
              clearPlaybackQueue();
              setStatus("listening", "Listening to you...");
            } else if (msg.event === "transcript") {
              addTranscript(msg.role, msg.text);
            } else if (msg.event === "stop") {
              endCall();
            }
          } catch (e) {
            console.error("Message parse error:", e);
          }
        };

        ws.onerror = (err) => {
          console.error("[WebPhone] WS Error:", err);
          setStatus("", "Connection Error");
          endCall();
        };

        ws.onclose = () => {
          console.log("[WebPhone] WS Closed");
          if (isCalling) endCall();
        };

      } catch (err) {
        console.error("Error starting call:", err);
        alert("Microphone permission required: " + (err.message || err));
        setStatus("", "Mic Permission Denied");
      }
    }

    function endCall() {
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      isCalling = false;
      clearInterval(timerInterval);

      clearPlaybackQueue();

      if (ws) {
        try {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ event: "stop" }));
            ws.close();
          }
        } catch (e) {}
        ws = null;
      }

      if (processor) {
        try { processor.disconnect(); } catch(e) {}
        processor = null;
      }
      if (micSource) {
        try { micSource.disconnect(); } catch(e) {}
        micSource = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch(e) {}
        audioCtx = null;
      }

      // Reset UI
      callBtn.style.display = "flex";
      hangupBtn.style.display = "none";
      muteBtn.style.visibility = "hidden";
      speakerBtn.style.visibility = "hidden";
      setStatus("", "Call Ended");
    }

    callBtn.addEventListener("click", startCall);
    hangupBtn.addEventListener("click", endCall);

    muteBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      muteBtn.classList.toggle("active", isMuted);
    });
  </script>
</body>
</html>
